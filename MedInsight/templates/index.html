<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedInsight AI | 医药合规审计与文献解析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 医药合规报告专属高级排版 */
        .med-report h3 { color: #0284c7; font-size: 1.25rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 2px solid #bae6fd; padding-bottom: 0.25rem; }
        .med-report p { margin-bottom: 1rem; line-height: 1.7; color: #334155; text-align: justify; }
        .med-report ul { list-style-type: square; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
        .med-report li { margin-bottom: 0.5rem; }
        .med-report strong { color: #ef4444; background-color: #fee2e2; padding: 0 4px; border-radius: 2px; font-weight: 600; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div id="welcomeLoader" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center transition-all duration-500">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md border border-slate-700 animate-pulse">
            <i class="fa-solid fa-prescription-bottle-medical text-sky-400 text-5xl mb-4"></i>
            <h3 class="text-xl font-bold text-white mb-2">MedInsight 临床大脑点火中</h3>
            <p class="text-slate-400 text-sm leading-relaxed mb-4">
                由于采用云端免费托管，服务器初次加载需激活唤醒约 <span class="text-sky-400 font-bold">20-30 秒</span>。后续运行将恢复极速响应，感谢您的耐心等待！
            </p>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div class="bg-gradient-to-r from-sky-400 to-blue-600 h-full w-full rounded-full transition-all duration-[20s]" style="width: 0%;" id="loadBar"></div>
            </div>
            <p class="text-xs text-slate-500 mt-4">本医学 SaaS 系统全栈由求职者独立研发与部署</p>
        </div>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-heart-pulse text-sky-600 text-2xl"></i>
                <h1 class="text-xl font-bold text-slate-800">MedInsight <span class="text-sky-600">AI</span></h1>
            </div>
            <div class="text-sm text-slate-500 font-medium">企业级医药合规审计与文献解析 SaaS</div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center"><i class="fa-solid fa-file-medical text-sky-500 mr-2"></i> 上传医学文献或宣传物料</h2>
            <p class="text-sm text-slate-500 mb-6">支持 PDF 或 Word 格式。系统将流式解析文本，自动提取临床核心数据，并扫描广告法违规红线。</p>
            
            <form id="auditForm" onsubmit="submitForm(event)" class="space-y-6">
                <div class="flex items-center justify-center w-full">
                    <label for="medicalFile" class="flex flex-col items-center justify-center w-full h-40 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-3"></i>
                            <p class="mb-2 text-sm text-slate-500"><span class="font-semibold">点击上传文献 / 物料文档</span></p>
                            <p class="text-xs text-slate-400">支持 .pdf, .docx, .doc 格式</p>
                        </div>
                        <input id="medicalFile" type="file" class="hidden" accept=".pdf,.doc,.docx" onchange="updateFileName()" required />
                    </label>
                </div>
                <p id="fileNameDisplay" class="text-center text-sm text-sky-600 font-medium hidden"></p>

                <div class="text-center">
                    <button type="submit" id="submitBtn" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-12 rounded-full shadow-lg shadow-sky-100 transition-all transform hover:-translate-y-0.5 inline-flex items-center space-x-2">
                        <i id="btnIcon" class="fa-solid fa-microscope"></i>
                        <span id="btnText">开始自动化合规审计</span>
                    </button>
                </div>
            </form>
        </div>

        <section id="resultSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="bg-slate-900 px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center space-x-2 text-white font-bold">
                        <i class="fa-solid fa-clipboard-check text-emerald-400"></i>
                        <span>MedInsight 自动化审计报告结果</span>
                    </div>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-mono">STATUS: COMPLETED</span>
                </div>
                <div class="p-8 bg-white">
                    <div id="resultContent" class="med-report"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 🪄 点火倒计时进度条与自动关闭
        window.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('loadBar');
            setTimeout(() => { bar.style.width = '100%'; }, 100);
            
            setTimeout(() => {
                const loader = document.getElementById('welcomeLoader');
                loader.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        });

        function updateFileName() {
            const fileInput = document.getElementById('medicalFile');
            const display = document.getElementById('fileNameDisplay');
            if (fileInput.files.length > 0) {
                display.innerText = '已成功加载文档: ' + fileInput.files[0].name;
                display.classList.remove('hidden');
            }
        }

        async function submitForm(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');

            btn.disabled = true;
            btn.classList.replace('bg-sky-600', 'bg-slate-400');
            btnIcon.className = 'fa-solid fa-spinner fa-spin';
            btnText.innerText = '医学大脑正在流式检索大模型、扫描法条红线...';
            resultSection.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', document.getElementById('medicalFile').files[0]);

            try {
                // 注意：这里对接的是你 MedInsight 本身的接口路由
                const response = await fetch('/api/audit', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (response.ok) {
                    resultContent.innerHTML = marked.parse(data.result);
                    resultSection.classList.remove('hidden');
                    resultSection.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('审计中断: ' + data.error);
                }
            } catch (error) {
                alert('网络异常: ' + error);
            }

            btn.disabled = false;
            btn.classList.replace('bg-slate-400', 'bg-sky-600');
            btnIcon.className = 'fa-solid fa-microscope';
            btnText.innerText = '开始自动化合规审计';
        }
    </script>
</body>
</html>
